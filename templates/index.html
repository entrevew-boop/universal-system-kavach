        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 700px; margin: 30px auto; padding: 10px; }

        .custom-alert h3 { color: #00FFCC; margin-top: 0; font-size: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .custom-alert p { color: #ffffff; font-size: 14px; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
        .custom-alert-btn { background-color: #00FFCC; color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; float: right; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; }

    <script>

</body>
</html>
